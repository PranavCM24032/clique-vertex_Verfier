name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare web assets (www/ from index.html)
        run: npm run prepare:web

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Apply branded icons, splash, and theme
        run: cp -r res/. android/app/src/main/res/

      - name: Sync Capacitor (web assets + config)
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Bump versionCode (newer than last build -> install over old APK)
        run: sed -i "s/versionCode 1/versionCode $((1000 + GITHUB_RUN_NUMBER))/" android/app/build.gradle

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Copy APK to friendly name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NP-Certificate-Verifier.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: np-verifier-apk
          name: NP Certificate Verifier — Android APK
          body: |
            Auto-built from the latest commit on main.

            **How to install**
            1. Download `NP-Certificate-Verifier.apk`.
            2. Transfer it to your Android phone (or open it directly on the phone's browser).
            3. Tap it and allow "Install from unknown sources" when prompted.

            The app works fully offline — all logic ships inside the APK.
          files: NP-Certificate-Verifier.apk
          make_latest: 'true'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NP-Certificate-Verifier-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30