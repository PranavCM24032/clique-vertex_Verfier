name: Build Windows Desktop App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Copy verifier into the desktop app
        run: cp app.html desktop/app.html
        shell: bash

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build Windows portable EXE (x64)
        working-directory: desktop
        run: npx electron-builder --win portable --publish never

      - name: Remove stale assets from earlier builds
        # windows-latest defaults run: to PowerShell, which cannot parse the
        # POSIX syntax below. Without this the step dies on a parse error and
        # the publish step below never runs.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: np-verifier-desktop
        run: |
          # This workflow republishes to the same tag every push, and
          # action-gh-release only *adds* to a release. Without this, assets from
          # older builds stay attached forever - which is how a retired installer
          # kept sitting next to the current portable .exe, two near-identical
          # downloads with different contents.
          cleanup_assets() {
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id' 2>/dev/null || true)
            if [ -z "$release_id" ]; then
              echo "No existing release for $TAG yet - nothing to clean up."
              return 0
            fi
            # Read the ids into a variable and loop with `for`, not a `while read`
            # pipeline: a pipeline body runs in a subshell, so a failure flag set
            # inside it would be discarded before the caller could see it.
            ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq '.[].id')
            failed=0
            for asset_id in $ids; do
              [ -n "$asset_id" ] || continue
              name=$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" --jq '.name')
              if gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; then
                echo "Deleted stale asset: $name"
              else
                echo "::warning::Could not delete $name (asset $asset_id)"
                failed=1
              fi
            done
            return $failed
          }
          # Housekeeping must never cost us the release itself: if the API call
          # fails, warn and carry on so the fresh EXE still gets published.
          if ! cleanup_assets; then
            echo "::warning::Could not clear old assets from the $TAG release; it may show more than one download."
          fi

      - name: Publish EXE to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: np-verifier-desktop
          name: NP Certificate Verifier — Windows App
          body: |
            Auto-built from the latest commit on main.

            Just download and double-click — no installation required.
            Works fully offline on Windows 10/11 (64-bit).

            **If Windows shows "Windows protected your PC":** this build is not
            code-signed, so SmartScreen blocks unfamiliar downloads. It is not a
            virus. Click **More info → Run anyway**, or right-click the file →
            **Properties** → tick **Unblock** → **Apply**. One-time only.
            First launch takes about 15 seconds while it unpacks itself.
          files: desktop/dist/NP-Certificate-Verifier.exe
          make_latest: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NP-Certificate-Verifier-Windows
          path: desktop/dist/NP-Certificate-Verifier.exe
          if-no-files-found: error
          retention-days: 30