name: Build Windows Desktop App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Copy verifier into the desktop app
        run: cp app.html desktop/app.html
        shell: bash

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build Windows portable EXE (x64)
        working-directory: desktop
        run: npx electron-builder --win portable --publish never

      - name: Publish EXE to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: np-verifier-desktop
          name: NP Certificate Verifier — Windows App
          body: |
            Auto-built from the latest commit on main.

            Just download and double-click — no installation required.
            Works fully offline on Windows 10/11 (64-bit).
          files: desktop/dist/NP-Certificate-Verifier.exe
          make_latest: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NP-Certificate-Verifier-Windows
          path: desktop/dist/NP-Certificate-Verifier.exe
          if-no-files-found: error
          retention-days: 30